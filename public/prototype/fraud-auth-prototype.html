<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="fraud.auth - verify payment requests before money leaves your account. Simulated hackathon prototype." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M20 3.5 L33.5 8.5 V19 C33.5 27.3 28 33.7 20 36.5 C12 33.7 6.5 27.3 6.5 19 V8.5 L20 3.5 Z' fill='%230b2540'/%3E%3Ccircle cx='20' cy='19.2' r='7.1' stroke='%23fff' stroke-width='2' fill='none'/%3E%3Ccircle cx='20' cy='19.2' r='2.6' fill='%23fff'/%3E%3C/svg%3E" />
<title>fraud.auth</title>
<style>
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
:root {
  /* Brand */
  --fa-navy: #0b2540;
  --fa-navy-2: #143556;
  --fa-teal: #178089;
  --fa-teal-strong: #106068;
  --fa-teal-tint: #e6f4f3;

  /* Neutrals */
  --fa-bg: #f4f7f9;
  --fa-surface: #ffffff;
  --fa-ink: #101826;
  --fa-slate: #56657a;
  --fa-slate-light: #8a97a3;
  --fa-border: #e1e7ec;
  --fa-border-strong: #c9d3da;

  /* Status */
  --fa-success: #1e7a4c;
  --fa-success-tint: #e7f5ee;
  --fa-warning: #9a5b00;
  --fa-warning-tint: #fdf3e1;
  --fa-danger: #b42d24;
  --fa-danger-tint: #fcebea;
  --fa-info: #245e9e;
  --fa-info-tint: #e8f0fa;

  /* Elevation, radius, type */
  --fa-shadow-sm: 0 1px 2px rgba(11, 37, 64, 0.05);
  --fa-shadow: 0 1px 2px rgba(11, 37, 64, 0.04), 0 8px 24px rgba(11, 37, 64, 0.06);
  --fa-shadow-lg: 0 20px 50px rgba(11, 37, 64, 0.18);
  --fa-radius-sm: 8px;
  --fa-radius: 12px;
  --fa-radius-lg: 18px;
  --fa-font: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fa-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* {
  box-sizing: border-box;
}

html,
body,
#root {
  min-height: 100%;
}

body {
  margin: 0;
  font-family: var(--fa-font);
  font-size: 15px;
  line-height: 1.5;
  color: var(--fa-ink);
  background: var(--fa-bg);
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3,
p {
  margin: 0;
}

h1,
h2,
h3 {
  letter-spacing: -0.015em;
  line-height: 1.25;
}

button,
input,
textarea {
  font: inherit;
  color: inherit;
}

a {
  color: var(--fa-teal-strong);
}

:focus-visible {
  outline: 2px solid var(--fa-teal);
  outline-offset: 2px;
}

.fa-visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}

@media print {
  body {
    background: #fff;
  }
  .fa-no-print {
    display: none !important;
  }
}
/* ---------- Logo ---------- */
.fa-logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.fa-logo__word {
  font-size: 19px;
  font-weight: 650;
  letter-spacing: -0.02em;
  color: var(--fa-navy);
}
.fa-logo--light .fa-logo__word {
  color: #fff;
}
.fa-logo__dot {
  color: var(--fa-teal);
}
.fa-logo--light .fa-logo__dot {
  color: #6fd0cf;
}

/* ---------- Buttons ---------- */
.fa-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: var(--fa-radius-sm);
  border: 1px solid transparent;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.fa-btn--md {
  font-size: 15px;
  padding: 11px 18px;
}
.fa-btn--sm {
  font-size: 13.5px;
  padding: 7px 12px;
}
.fa-btn--lg {
  font-size: 16px;
  padding: 13px 22px;
}
.fa-btn--block {
  width: 100%;
}
.fa-btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
.fa-btn[aria-busy="true"] {
  cursor: progress;
  opacity: 0.8;
}
.fa-btn--primary {
  background: var(--fa-teal);
  color: #fff;
}
.fa-btn--primary:hover:not(:disabled) {
  background: var(--fa-teal-strong);
}
.fa-btn--secondary {
  background: var(--fa-surface);
  border-color: var(--fa-border-strong);
  color: var(--fa-ink);
}
.fa-btn--secondary:hover:not(:disabled) {
  border-color: var(--fa-slate-light);
  background: var(--fa-bg);
}
.fa-btn--ghost {
  background: transparent;
  color: var(--fa-teal-strong);
  padding-left: 8px;
  padding-right: 8px;
}
.fa-btn--ghost:hover:not(:disabled) {
  background: var(--fa-teal-tint);
}
.fa-btn--danger {
  background: var(--fa-surface);
  border-color: #e6b7b3;
  color: var(--fa-danger);
}
.fa-btn--danger:hover:not(:disabled) {
  background: var(--fa-danger-tint);
}
.fa-btn__spinner {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2px solid currentColor;
  border-right-color: transparent;
  animation: fa-spin 0.7s linear infinite;
}
@keyframes fa-spin {
  to {
    transform: rotate(360deg);
  }
}

.fa-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border: none;
  background: transparent;
  border-radius: var(--fa-radius-sm);
  color: var(--fa-slate);
  cursor: pointer;
}
.fa-icon-btn:hover {
  background: var(--fa-bg);
  color: var(--fa-ink);
}

/* ---------- Fields ---------- */
.fa-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.fa-field__label {
  font-size: 13.5px;
  font-weight: 600;
}
.fa-field__control {
  display: flex;
  align-items: center;
  background: var(--fa-surface);
  border: 1px solid var(--fa-border-strong);
  border-radius: var(--fa-radius-sm);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.fa-field__control:focus-within {
  border-color: var(--fa-teal);
  box-shadow: 0 0 0 3px var(--fa-teal-tint);
}
.fa-field--error .fa-field__control {
  border-color: var(--fa-danger);
}
.fa-field--error .fa-field__control:focus-within {
  box-shadow: 0 0 0 3px var(--fa-danger-tint);
}
.fa-field__input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  padding: 11px 14px;
  font-size: 15px;
}
.fa-field__action {
  display: flex;
  border: none;
  background: transparent;
  color: var(--fa-slate);
  padding: 8px 12px;
  cursor: pointer;
}
.fa-field__action:hover {
  color: var(--fa-teal-strong);
}
.fa-field__hint {
  font-size: 12.5px;
  color: var(--fa-slate);
}
.fa-field__error {
  font-size: 12.5px;
  color: var(--fa-danger);
  font-weight: 500;
}

.fa-checkbox {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 14px;
  cursor: pointer;
}
.fa-checkbox input {
  width: 17px;
  height: 17px;
  margin: 2px 0 0;
  flex-shrink: 0;
  accent-color: var(--fa-teal);
  cursor: pointer;
}

.fa-textarea {
  width: 100%;
  min-height: 90px;
  resize: vertical;
  padding: 10px 12px;
  border: 1px solid var(--fa-border-strong);
  border-radius: var(--fa-radius-sm);
  font-size: 14px;
}
.fa-textarea:focus {
  outline: none;
  border-color: var(--fa-teal);
  box-shadow: 0 0 0 3px var(--fa-teal-tint);
}

/* ---------- Divider ---------- */
.fa-divider {
  display: flex;
  align-items: center;
  gap: 12px;
}
.fa-divider__line {
  flex: 1;
  height: 1px;
  background: var(--fa-border);
}
.fa-divider__label {
  font-size: 13px;
  color: var(--fa-slate);
}

/* ---------- Alerts ---------- */
.fa-alert {
  display: flex;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--fa-radius-sm);
  border: 1px solid;
  font-size: 14px;
}
.fa-alert__icon {
  flex-shrink: 0;
  margin-top: 1px;
}
.fa-alert__title {
  font-weight: 600;
}
.fa-alert__body {
  color: inherit;
  opacity: 0.92;
}
.fa-alert__title + .fa-alert__body {
  margin-top: 2px;
}
.fa-alert--info {
  background: var(--fa-info-tint);
  border-color: #c7d9ef;
  color: var(--fa-info);
}
.fa-alert--success {
  background: var(--fa-success-tint);
  border-color: #bfe3cf;
  color: var(--fa-success);
}
.fa-alert--warning {
  background: var(--fa-warning-tint);
  border-color: #f0d7a8;
  color: var(--fa-warning);
}
.fa-alert--danger {
  background: var(--fa-danger-tint);
  border-color: #f0c4c0;
  color: var(--fa-danger);
}

/* ---------- Badges ---------- */
.fa-badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.fa-badge--success {
  background: var(--fa-success-tint);
  color: var(--fa-success);
}
.fa-badge--warning {
  background: var(--fa-warning-tint);
  color: var(--fa-warning);
}
.fa-badge--danger {
  background: var(--fa-danger-tint);
  color: var(--fa-danger);
}
.fa-badge--info {
  background: var(--fa-info-tint);
  color: var(--fa-info);
}
.fa-badge--neutral {
  background: var(--fa-bg);
  color: var(--fa-slate);
}

/* ---------- Empty state ---------- */
.fa-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 6px;
  padding: 36px 20px;
}
.fa-empty__icon {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--fa-teal-tint);
  color: var(--fa-teal-strong);
  margin-bottom: 6px;
}
.fa-empty__title {
  font-weight: 600;
  font-size: 16px;
}
.fa-empty__text {
  color: var(--fa-slate);
  font-size: 14px;
  max-width: 360px;
}
.fa-empty .fa-btn {
  margin-top: 10px;
}

/* ---------- Modal ---------- */
.fa-modal {
  padding: 0;
  border: none;
  border-radius: var(--fa-radius-lg);
  box-shadow: var(--fa-shadow-lg);
  width: min(560px, calc(100vw - 24px));
  max-height: calc(100vh - 40px);
  color: var(--fa-ink);
}
.fa-modal::backdrop {
  background: rgba(11, 37, 64, 0.45);
}
.fa-modal__panel {
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 40px);
}
.fa-modal__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 22px;
  border-bottom: 1px solid var(--fa-border);
}
.fa-modal__header h2 {
  font-size: 18px;
}
.fa-modal__body {
  padding: 20px 22px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.fa-modal__footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 14px 22px;
  border-top: 1px solid var(--fa-border);
  background: var(--fa-bg);
}
@media (max-width: 520px) {
  .fa-modal__footer {
    flex-direction: column-reverse;
  }
  .fa-modal__footer .fa-btn {
    width: 100%;
  }
}
/* ================= Auth layout ================= */
.fa-auth {
  min-height: 100vh;
  display: grid;
  grid-template-columns: minmax(320px, 38%) 1fr;
}
.fa-auth__brand {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 48px 44px;
  background: var(--fa-navy);
  color: #fff;
}
.fa-auth__mesh {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 82% 22%, rgba(23, 128, 137, 0.35), transparent 42%),
    repeating-radial-gradient(circle at 82% 22%, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 46px);
  pointer-events: none;
}
.fa-auth__brand-content,
.fa-auth__footnote {
  position: relative;
  max-width: 340px;
}
.fa-auth__tagline {
  margin-top: 36px;
  font-size: 26px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.fa-auth__pitch {
  margin-top: 14px;
  color: rgba(255, 255, 255, 0.72);
  font-size: 15px;
}
.fa-auth__footnote {
  font-size: 13px;
  color: rgba(255, 255, 255, 0.55);
}
.fa-auth__main {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
}
.fa-auth__card {
  width: 100%;
  max-width: 420px;
  background: var(--fa-surface);
  border: 1px solid var(--fa-border);
  border-radius: var(--fa-radius-lg);
  box-shadow: var(--fa-shadow);
  padding: 36px 34px 28px;
}
.fa-auth__card--wide {
  max-width: 520px;
}
.fa-auth__mobile-logo {
  display: none;
  margin-bottom: 22px;
}
.fa-auth__step {
  font-size: 13px;
  font-weight: 600;
  color: var(--fa-teal-strong);
  margin-bottom: 8px;
}
.fa-auth__title {
  font-size: 24px;
  margin-bottom: 6px;
}
.fa-auth__subtitle {
  color: var(--fa-slate);
  margin-bottom: 26px;
}
.fa-auth__form {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.fa-auth__switch {
  text-align: center;
  font-size: 14px;
  color: var(--fa-slate);
}
.fa-auth__switch a,
.fa-auth__switch button {
  font-weight: 600;
  color: var(--fa-teal-strong);
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  text-decoration: none;
}
.fa-auth__switch a:hover,
.fa-auth__switch button:hover {
  text-decoration: underline;
}
.fa-auth__secure {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  margin-top: 26px;
  font-size: 12.5px;
  color: var(--fa-slate-light);
}
.fa-auth__actions {
  display: flex;
  gap: 10px;
}
.fa-auth__actions .fa-btn {
  flex: 1;
}

@media (max-width: 1024px) {
  .fa-auth {
    grid-template-columns: minmax(280px, 34%) 1fr;
  }
}
@media (max-width: 760px) {
  .fa-auth {
    grid-template-columns: 1fr;
  }
  .fa-auth__brand {
    display: none;
  }
  .fa-auth__main {
    align-items: flex-start;
    padding: 24px 16px 40px;
  }
  .fa-auth__card {
    border: none;
    box-shadow: none;
    padding: 24px 18px;
  }
  .fa-auth__mobile-logo {
    display: block;
  }
}

/* ================= App shell ================= */
.fa-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.fa-shell__header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--fa-border);
}
.fa-shell__bar {
  max-width: 1180px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 28px;
  padding: 12px 24px;
}
.fa-shell__logo {
  display: flex;
  text-decoration: none;
}
.fa-shell__nav {
  display: flex;
  gap: 4px;
  flex: 1;
}
.fa-nav-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: var(--fa-radius-sm);
  font-size: 14.5px;
  font-weight: 550;
  color: var(--fa-slate);
  text-decoration: none;
  white-space: nowrap;
}
.fa-nav-link:hover {
  color: var(--fa-ink);
  background: var(--fa-bg);
}
.fa-nav-link.is-active {
  color: var(--fa-navy);
  background: var(--fa-teal-tint);
}
.fa-nav-link__short {
  display: none;
}
.fa-nav-link__count {
  min-width: 20px;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--fa-teal);
  color: #fff;
  font-size: 12px;
  text-align: center;
}
.fa-shell__main {
  flex: 1;
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding: 32px 24px 48px;
}
.fa-shell__footer {
  text-align: center;
  font-size: 12.5px;
  color: var(--fa-slate-light);
  padding: 18px 24px 28px;
}

@media (max-width: 760px) {
  .fa-shell__bar {
    flex-wrap: wrap;
    gap: 10px 12px;
    padding: 10px 16px;
  }
  .fa-shell__logo {
    flex: 1;
  }
  .fa-shell__nav {
    order: 3;
    flex-basis: 100%;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .fa-nav-link--dual .fa-nav-link__full {
    display: none;
  }
  .fa-nav-link--dual .fa-nav-link__short {
    display: inline;
  }
  .fa-shell__main {
    padding: 20px 16px 40px;
  }
}

/* ================= Profile menu ================= */
.fa-profile {
  position: relative;
}
.fa-profile__trigger {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px 4px 4px;
  border: 1px solid var(--fa-border);
  border-radius: 999px;
  background: var(--fa-surface);
  cursor: pointer;
  color: var(--fa-slate);
}
.fa-profile__trigger:hover {
  border-color: var(--fa-border-strong);
}
.fa-profile__name {
  font-size: 14px;
  font-weight: 600;
  color: var(--fa-ink);
}
.fa-avatar {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--fa-navy);
  color: #fff;
  font-size: 12.5px;
  font-weight: 650;
}
.fa-avatar--lg {
  width: 42px;
  height: 42px;
  font-size: 15px;
}
.fa-profile__panel {
  position: absolute;
  right: 0;
  top: calc(100% + 8px);
  width: 310px;
  max-width: calc(100vw - 24px);
  background: var(--fa-surface);
  border: 1px solid var(--fa-border);
  border-radius: var(--fa-radius);
  box-shadow: var(--fa-shadow-lg);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.fa-profile__head {
  display: flex;
  align-items: center;
  gap: 12px;
}
.fa-profile__fullname {
  font-weight: 650;
}
.fa-profile__email {
  font-size: 13px;
  color: var(--fa-slate);
  word-break: break-all;
}
.fa-profile__details {
  margin: 0;
  padding: 12px 0;
  border-top: 1px solid var(--fa-border);
  border-bottom: 1px solid var(--fa-border);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.fa-profile__details div {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.fa-profile__details dt {
  font-size: 13px;
  color: var(--fa-slate);
}
.fa-profile__details dd {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  text-align: right;
}
.fa-profile__account {
  display: flex;
  align-items: center;
  gap: 2px;
}
.fa-profile__account .fa-icon-btn {
  width: 30px;
  height: 30px;
}
.fa-mono {
  font-family: var(--fa-mono);
  font-size: 13.5px;
  letter-spacing: 0.02em;
}
.fa-profile__note {
  font-size: 12px;
  color: var(--fa-slate-light);
}
.fa-profile__reset {
  align-self: center;
  border: none;
  background: none;
  font-size: 12px;
  color: var(--fa-slate-light);
  cursor: pointer;
  text-decoration: underline;
  padding: 2px;
}
.fa-profile__reset:hover {
  color: var(--fa-danger);
}
@media (max-width: 760px) {
  .fa-profile__name {
    display: none;
  }
}
/* ---------- Page chrome ---------- */
.fa-page {
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.fa-page--narrow {
  max-width: 640px;
  margin: 0 auto;
  width: 100%;
}
.fa-page__header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.fa-page__eyebrow {
  font-size: 13.5px;
  color: var(--fa-slate);
  margin-bottom: 2px;
}
.fa-page__title {
  font-size: 27px;
  font-weight: 650;
}
.fa-page__subtitle {
  color: var(--fa-slate);
  margin-top: 4px;
  max-width: 62ch;
}
.fa-back {
  align-self: flex-start;
  margin-left: -8px;
}
.fa-inline-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

/* ---------- Card ---------- */
.fa-card {
  min-width: 0;
  background: var(--fa-surface);
  border: 1px solid var(--fa-border);
  border-radius: var(--fa-radius-lg);
  box-shadow: var(--fa-shadow-sm);
  padding: 22px 24px;
}
.fa-card__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 4px;
}
.fa-card__header h2 {
  font-size: 17px;
}
.fa-card__link {
  font-size: 13.5px;
  font-weight: 600;
  text-decoration: none;
}
.fa-card__link:hover {
  text-decoration: underline;
}

/* ---------- Welcome points ---------- */
.fa-welcome-points {
  list-style: none;
  margin: 0 0 26px;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.fa-welcome-points li {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  font-size: 14.5px;
  color: var(--fa-slate);
}
.fa-welcome-points__icon {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--fa-teal-tint);
  color: var(--fa-teal-strong);
}

/* ---------- Bank picker ---------- */
.fa-bank-picker {
  border: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.fa-bank-picker__grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.fa-bank-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 16px 10px;
  border: 1.5px solid var(--fa-border-strong);
  border-radius: var(--fa-radius);
  background: var(--fa-surface);
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.fa-bank-card:hover {
  border-color: var(--fa-slate-light);
}
.fa-bank-card:focus-within {
  border-color: var(--fa-teal);
  box-shadow: 0 0 0 3px var(--fa-teal-tint);
}
.fa-bank-card.is-selected {
  border-color: var(--fa-teal);
  background: var(--fa-teal-tint);
}
.fa-bank-card__monogram {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: var(--fa-navy);
  color: #fff;
  font-weight: 650;
}
.fa-bank-card__name {
  font-size: 14px;
  font-weight: 600;
}
.fa-bank-card__check {
  position: absolute;
  top: 8px;
  right: 8px;
  display: none;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--fa-teal);
  color: #fff;
}
.fa-bank-card.is-selected .fa-bank-card__check {
  display: grid;
}
@media (max-width: 420px) {
  .fa-bank-picker__grid {
    grid-template-columns: 1fr;
  }
  .fa-bank-card {
    flex-direction: row;
    justify-content: flex-start;
    gap: 12px;
  }
}

/* ---------- Account created ---------- */
.fa-created {
  text-align: center;
  margin-bottom: 22px;
}
.fa-created__icon {
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: var(--fa-success-tint);
  color: var(--fa-success);
}
.fa-created__note {
  margin: 16px 0 20px;
  font-size: 14px;
  color: var(--fa-slate);
  text-align: center;
}
.fa-summary {
  margin: 0 0 22px;
  padding: 16px 18px;
  background: var(--fa-bg);
  border-radius: var(--fa-radius);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.fa-summary div {
  display: flex;
  justify-content: space-between;
  gap: 14px;
}
.fa-summary dt {
  font-size: 13.5px;
  color: var(--fa-slate);
}
.fa-summary dd {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  text-align: right;
  word-break: break-word;
}

/* ---------- Approval banner ---------- */
.fa-approval-banner {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 22px 26px;
  border-radius: var(--fa-radius-lg);
  background: linear-gradient(120deg, var(--fa-navy) 0%, var(--fa-navy-2) 100%);
  color: #fff;
}
.fa-approval-banner__count {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 62px;
  height: 62px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  border: 1.5px solid rgba(255, 255, 255, 0.35);
  font-size: 26px;
  font-weight: 650;
}
.fa-approval-banner__text {
  flex: 1;
}
.fa-approval-banner__text h2 {
  font-size: 19px;
  margin-bottom: 4px;
}
.fa-approval-banner__text p {
  color: rgba(255, 255, 255, 0.72);
  font-size: 14.5px;
}
.fa-approval-banner__cta {
  flex-shrink: 0;
}
.fa-approval-banner--clear {
  background: var(--fa-surface);
  color: var(--fa-ink);
  border: 1px solid var(--fa-border);
}
.fa-approval-banner--clear .fa-approval-banner__count {
  background: var(--fa-success-tint);
  border-color: #bfe3cf;
  color: var(--fa-success);
}
.fa-approval-banner--clear .fa-approval-banner__text p {
  color: var(--fa-slate);
}
@media (max-width: 720px) {
  .fa-approval-banner {
    flex-direction: column;
    align-items: flex-start;
    padding: 20px;
  }
  .fa-approval-banner__cta {
    width: 100%;
  }
}

/* ---------- Stat cards ---------- */
.fa-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.fa-stat {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 18px 20px;
  background: var(--fa-surface);
  border: 1px solid var(--fa-border);
  border-left: 3px solid var(--fa-border-strong);
  border-radius: var(--fa-radius);
  box-shadow: var(--fa-shadow-sm);
  text-decoration: none;
  color: inherit;
  transition: border-color 0.15s ease;
}
.fa-stat:hover {
  border-color: var(--fa-border-strong);
}
.fa-stat--navy {
  border-left-color: var(--fa-navy);
}
.fa-stat--success {
  border-left-color: var(--fa-success);
}
.fa-stat--info {
  border-left-color: var(--fa-info);
}
.fa-stat--warning {
  border-left-color: var(--fa-warning);
}
.fa-stat__label {
  font-size: 13px;
  color: var(--fa-slate);
}
.fa-stat__value {
  font-size: 28px;
  font-weight: 650;
  letter-spacing: -0.02em;
}
@media (max-width: 860px) {
  .fa-stats {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* ---------- Dashboard grid ---------- */
.fa-dashboard-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}
@media (max-width: 960px) {
  .fa-dashboard-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ---------- Education card ---------- */
.fa-edu {
  display: flex;
  gap: 12px;
  padding: 20px 22px;
  background: var(--fa-surface);
  border: 1px solid var(--fa-border);
  border-radius: var(--fa-radius-lg);
  box-shadow: var(--fa-shadow-sm);
}
.fa-edu__icon {
  flex-shrink: 0;
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--fa-info-tint);
  color: var(--fa-info);
}
.fa-edu__title {
  font-size: 15.5px;
  margin-bottom: 6px;
}
.fa-edu p {
  font-size: 13.5px;
  color: var(--fa-slate);
}
.fa-edu p + p {
  margin-top: 8px;
}

/* ---------- Transaction list ---------- */
.fa-tx-list {
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
}
.fa-tx-list > li + li,
.fa-tx-list > li + li > .fa-tx {
  border-top: 1px solid var(--fa-border);
}
.fa-tx {
  display: flex;
  align-items: center;
  min-width: 0;
  gap: 14px;
  padding: 13px 2px;
  text-decoration: none;
  color: inherit;
}
.fa-tx--link {
  margin: 0 -8px;
  padding: 13px 8px;
  border-radius: var(--fa-radius-sm);
}
.fa-tx--link:hover {
  background: var(--fa-bg);
}
.fa-tx__icon {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: var(--fa-bg);
  color: var(--fa-slate);
}
.fa-tx__icon--in {
  background: var(--fa-success-tint);
  color: var(--fa-success);
}
.fa-tx__main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.fa-tx__recipient {
  font-weight: 600;
  font-size: 14.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.fa-tx__meta {
  font-size: 12.5px;
  color: var(--fa-slate);
}
.fa-tx__side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 5px;
  flex-shrink: 0;
}
.fa-tx__amount {
  font-weight: 650;
  font-size: 14.5px;
  white-space: nowrap;
}
.fa-tx__amount.is-in {
  color: var(--fa-success);
}
.fa-tx__badges {
  display: flex;
  gap: 5px;
}
.fa-tx__chevron {
  flex-shrink: 0;
  color: var(--fa-slate-light);
}
@media (max-width: 560px) {
  .fa-tx__icon {
    display: none;
  }
  .fa-tx__badges {
    flex-wrap: wrap;
    justify-content: flex-end;
  }
}

/* ---------- Approval queue ---------- */
.fa-queue {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.fa-queue__item {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 20px 24px;
  background: var(--fa-surface);
  border: 1px solid var(--fa-border);
  border-radius: var(--fa-radius-lg);
  box-shadow: var(--fa-shadow-sm);
}
.fa-queue__index {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--fa-bg);
  color: var(--fa-slate);
  font-weight: 650;
  font-size: 14px;
}
.fa-queue__main {
  flex: 1;
  min-width: 0;
}
.fa-queue__top {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 4px;
}
.fa-queue__recipient {
  font-size: 16px;
  font-weight: 650;
}
.fa-queue__meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13.5px;
  color: var(--fa-slate);
}
.fa-queue__ref {
  font-size: 12.5px;
  color: var(--fa-slate-light);
  margin-top: 2px;
}
.fa-queue__side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
  flex-shrink: 0;
}
.fa-queue__amount {
  font-size: 19px;
  font-weight: 650;
}
@media (max-width: 720px) {
  .fa-queue__item {
    flex-wrap: wrap;
    padding: 18px;
    gap: 12px;
  }
  .fa-queue__side {
    width: 100%;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }
}

/* ---------- Tabs ---------- */
.fa-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 2px;
}
.fa-tab {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border: 1px solid var(--fa-border);
  border-radius: 999px;
  background: var(--fa-surface);
  font-size: 14px;
  font-weight: 550;
  color: var(--fa-slate);
  cursor: pointer;
  white-space: nowrap;
}
.fa-tab:hover {
  border-color: var(--fa-border-strong);
  color: var(--fa-ink);
}
.fa-tab.is-active {
  background: var(--fa-navy);
  border-color: var(--fa-navy);
  color: #fff;
}
.fa-tab__count {
  font-size: 12px;
  opacity: 0.75;
}

/* ---------- Crash screen ---------- */
.fa-crash {
  max-width: 460px;
  margin: 15vh auto;
  padding: 0 24px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 12px;
}
.fa-crash h1 {
  font-size: 22px;
  margin-top: 8px;
}
.fa-crash p {
  color: var(--fa-slate);
}
/* ---------- Verification layout ---------- */
.fa-verify {
  display: grid;
  grid-template-columns: minmax(0, 2.1fr) minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}
.fa-verify__main {
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-width: 0;
}
@media (max-width: 1000px) {
  .fa-verify {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ---------- Request details ---------- */
.fa-request__amount {
  font-size: 32px;
  font-weight: 650;
  letter-spacing: -0.02em;
  margin-top: 14px;
}
.fa-request__to {
  color: var(--fa-slate);
  margin-top: 2px;
}
.fa-request__grid {
  margin: 22px 0 0;
  padding: 18px 0 0;
  border-top: 1px solid var(--fa-border);
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px 24px;
}
.fa-request__grid dt {
  font-size: 12.5px;
  color: var(--fa-slate);
  margin-bottom: 3px;
}
.fa-request__grid dd {
  margin: 0;
  font-size: 14.5px;
  font-weight: 550;
  word-break: break-word;
}
.fa-request__text {
  margin-top: 20px;
}
.fa-request__text-label {
  font-size: 12.5px;
  color: var(--fa-slate);
  margin-bottom: 8px;
}
.fa-request__text blockquote {
  margin: 0;
  padding: 14px 16px;
  background: var(--fa-bg);
  border-left: 3px solid var(--fa-border-strong);
  border-radius: 0 var(--fa-radius-sm) var(--fa-radius-sm) 0;
  font-size: 14px;
  color: var(--fa-ink);
  line-height: 1.6;
}
@media (max-width: 560px) {
  .fa-request__grid {
    grid-template-columns: 1fr;
  }
}

/* ---------- Prompt ---------- */
.fa-prompt h2 {
  font-size: 17px;
  margin-bottom: 6px;
}
.fa-prompt p {
  color: var(--fa-slate);
  margin-bottom: 16px;
  max-width: 60ch;
}

/* ---------- Analysing ---------- */
.fa-analysing__head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
}
.fa-analysing__head h2 {
  font-size: 17px;
}
.fa-analysing__head p {
  font-size: 13.5px;
  color: var(--fa-slate);
  margin-top: 2px;
}
.fa-analysing__pulse {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--fa-teal-tint);
  color: var(--fa-teal-strong);
  animation: fa-pulse 1.6s ease-in-out infinite;
}
@keyframes fa-pulse {
  0%,
  100% {
    box-shadow: 0 0 0 0 rgba(23, 128, 137, 0.25);
  }
  50% {
    box-shadow: 0 0 0 8px rgba(23, 128, 137, 0);
  }
}
.fa-progress {
  height: 6px;
  border-radius: 999px;
  background: var(--fa-bg);
  overflow: hidden;
}
.fa-progress span {
  display: block;
  height: 100%;
  background: var(--fa-teal);
  border-radius: 999px;
  transition: width 0.3s ease;
}
.fa-analysing__steps {
  list-style: none;
  margin: 18px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px 20px;
}
.fa-analysing__steps li {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 13.5px;
  color: var(--fa-slate-light);
  transition: color 0.2s ease;
}
.fa-analysing__steps li.is-done {
  color: var(--fa-ink);
}
.fa-analysing__steps li.is-active {
  color: var(--fa-teal-strong);
  font-weight: 600;
}
.fa-analysing__marker {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
}
.fa-analysing__steps li.is-done .fa-analysing__marker {
  background: var(--fa-success);
  border-color: var(--fa-success);
  color: #fff;
}
@media (max-width: 620px) {
  .fa-analysing__steps {
    grid-template-columns: 1fr;
  }
}

/* ---------- Results ---------- */
.fa-results__summary {
  display: flex;
  align-items: center;
  gap: 26px;
  margin: 18px 0 22px;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--fa-border);
}
.fa-score-ring {
  position: relative;
  flex-shrink: 0;
  width: 118px;
  height: 118px;
}
.fa-score-ring svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}
.fa-score-ring circle {
  fill: none;
  stroke-width: 9;
  stroke-linecap: round;
}
.fa-score-ring__track {
  stroke: var(--fa-bg);
}
.fa-score-ring__value {
  transition: stroke-dashoffset 0.8s ease;
}
.fa-score-ring--success .fa-score-ring__value {
  stroke: var(--fa-success);
}
.fa-score-ring--warning .fa-score-ring__value {
  stroke: var(--fa-warning);
}
.fa-score-ring--danger .fa-score-ring__value {
  stroke: var(--fa-danger);
}
.fa-score-ring__number {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 27px;
  font-weight: 650;
  letter-spacing: -0.02em;
}
.fa-results__label {
  font-size: 12.5px;
  color: var(--fa-slate);
}
.fa-results__verdict {
  font-size: 21px;
  font-weight: 650;
  margin: 2px 0 8px;
}
.fa-results__explain {
  font-size: 13.5px;
  color: var(--fa-slate);
  max-width: 46ch;
}
.fa-text--success {
  color: var(--fa-success);
}
.fa-text--warning {
  color: var(--fa-warning);
}
.fa-text--danger {
  color: var(--fa-danger);
}
.fa-results__footnote {
  margin-top: 18px;
  font-size: 12.5px;
  color: var(--fa-slate-light);
}
@media (max-width: 620px) {
  .fa-results__summary {
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
  }
}

/* ---------- Check rows ---------- */
.fa-checks {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.fa-check {
  border: 1px solid var(--fa-border);
  border-radius: var(--fa-radius-sm);
  overflow: hidden;
}
.fa-check__head {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 12px 14px;
  background: var(--fa-surface);
  border: none;
  cursor: pointer;
  text-align: left;
}
.fa-check__head:hover {
  background: var(--fa-bg);
}
.fa-check__icon {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  color: #fff;
}
.fa-check--success .fa-check__icon {
  background: var(--fa-success);
}
.fa-check--warning .fa-check__icon {
  background: var(--fa-warning);
}
.fa-check--danger .fa-check__icon {
  background: var(--fa-danger);
}
.fa-check__label {
  flex: 1;
  font-size: 14.5px;
  font-weight: 600;
}
.fa-check__status {
  font-size: 12.5px;
  font-weight: 650;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.fa-check--success .fa-check__status {
  color: var(--fa-success);
}
.fa-check--warning .fa-check__status {
  color: var(--fa-warning);
}
.fa-check--danger .fa-check__status {
  color: var(--fa-danger);
}
.fa-check__chevron {
  color: var(--fa-slate-light);
  transition: transform 0.15s ease;
}
.fa-check__chevron.is-open {
  transform: rotate(180deg);
}
.fa-check__findings {
  list-style: none;
  margin: 0;
  padding: 2px 14px 13px 47px;
  background: var(--fa-surface);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.fa-check__findings li {
  position: relative;
  font-size: 13.5px;
  color: var(--fa-slate);
  line-height: 1.5;
}
.fa-check__findings li::before {
  content: "";
  position: absolute;
  left: -14px;
  top: 7px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.fa-check__findings li.is-ok {
  color: var(--fa-success);
}
.fa-check__findings li.is-warn {
  color: var(--fa-warning);
}
.fa-check__findings li.is-bad {
  color: var(--fa-danger);
}

/* ---------- Decision panel ---------- */
.fa-decision {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.fa-decision__title {
  font-size: 17px;
}
.fa-decision__text {
  color: var(--fa-slate);
  max-width: 68ch;
  margin-top: -4px;
}
.fa-decision__warnings {
  margin: 0;
  padding: 14px 16px 14px 32px;
  background: var(--fa-warning-tint);
  border-radius: var(--fa-radius-sm);
  color: var(--fa-warning);
  font-size: 13.5px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.fa-decision__ack {
  color: var(--fa-slate);
}
.fa-decision__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding-top: 4px;
}
@media (max-width: 620px) {
  .fa-decision__actions .fa-btn {
    width: 100%;
  }
}

/* ---------- Modal content ---------- */
.fa-modal__lede {
  font-size: 14.5px;
  color: var(--fa-slate);
}
.fa-modal__label {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 8px;
  display: block;
}
.fa-modal__indicators {
  margin: 0;
  padding: 12px 16px 12px 30px;
  background: var(--fa-danger-tint);
  color: var(--fa-danger);
  border-radius: var(--fa-radius-sm);
  font-size: 13.5px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.fa-modal__options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ---------- Receipt ---------- */
.fa-receipt {
  background: var(--fa-surface);
  border: 1px solid var(--fa-border);
  border-radius: var(--fa-radius-lg);
  box-shadow: var(--fa-shadow);
  padding: 26px 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.fa-receipt__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--fa-border);
}
.fa-receipt__sim {
  font-size: 11.5px;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--fa-slate);
  border: 1px solid var(--fa-border-strong);
  border-radius: 999px;
  padding: 3px 10px;
}
.fa-receipt__status {
  text-align: center;
}
.fa-receipt__tick {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  margin: 0 auto 14px;
  border-radius: 50%;
  background: var(--fa-success-tint);
  color: var(--fa-success);
}
.fa-receipt__status h1 {
  font-size: 19px;
  margin-bottom: 10px;
}
.fa-receipt__amount {
  font-size: 34px;
  font-weight: 650;
  letter-spacing: -0.02em;
}
.fa-receipt__to {
  color: var(--fa-slate);
  font-size: 14px;
  margin-top: 2px;
}
.fa-receipt__rows {
  margin: 0;
  padding: 18px 0;
  border-top: 1px solid var(--fa-border);
  border-bottom: 1px solid var(--fa-border);
  display: flex;
  flex-direction: column;
  gap: 11px;
}
.fa-receipt__rows div {
  display: flex;
  justify-content: space-between;
  gap: 16px;
}
.fa-receipt__rows dt {
  font-size: 13.5px;
  color: var(--fa-slate);
}
.fa-receipt__rows dd {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  text-align: right;
  word-break: break-word;
}
.fa-receipt__footer {
  text-align: center;
  font-size: 12px;
  color: var(--fa-slate-light);
}

</style>
